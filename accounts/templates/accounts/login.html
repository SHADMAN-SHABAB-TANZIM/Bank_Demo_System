{% extends "accounts/base.html" %}

{% block title %}
Login
{% endblock %}

{% block content %}

<div class="login-page">

    <div class="login-card">

        <div style="text-align:center; margin-bottom:30px;">

            <div style="
                font-size:13px;
                letter-spacing:3px;
                color:#64748b;
                margin-bottom:8px;
            ">
                BANKSYS
            </div>

            <h1>
                Welcome Back
            </h1>

            <p>
                Sign in to your management account.
            </p>

        </div>


        <form method="post">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">
                Sign In
            </button>

        </form>

    </div>

</div>

{% endblock %}
